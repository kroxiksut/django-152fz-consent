name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:

jobs:
  lint:
    name: Lint and Format
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install lint dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run ruff lint
        run: ruff check .

      - name: Run ruff format check
        run: ruff format --check .

      - name: Run pyright
        run: pyright

  tests-consent-standalone:
    name: Consent standalone (Django ${{ matrix.django-version }}, Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.10"
            django-version: ">=5,<6"
          - python-version: "3.12"
            django-version: ">=6,<7"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install consent standalone dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]" "Django${{ matrix.django-version }}"

      - name: Run consent standalone tests
        run: |
          pytest -q \
            tests/test_document_models.py \
            tests/test_consent_record_model.py \
            tests/test_consent_event_model.py \
            tests/test_core_services.py \
            tests/test_service_api.py \
            tests/test_feature_flags_config.py

  tests-cookies-standalone:
    name: Cookies standalone (Python 3.12)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install cookies standalone dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]" "Django>=6,<7"

      - name: Run cookies standalone tests
        run: |
          pytest -q \
            tests/test_cookie_only_router.py \
            tests/test_cookie_standalone_split.py \
            tests/test_split_upgrade_path.py

  tests-integration:
    name: Integration smoke (both packages)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install integration dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test,api]" "Django>=6,<7"

      - name: Run integration smoke tests
        run: pytest -q tests/test_stage_3_to_5_smoke.py

  tests-api-extra:
    name: Tests API extra
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install API test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test,api]" "Django>=6,<7"

      - name: Run tests (with api extra)
        run: pytest

  package-consent:
    name: Build package (consent)
    runs-on: ubuntu-latest
    needs: [lint, tests-consent-standalone, tests-cookies-standalone, tests-integration, tests-api-extra]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install gettext
        run: |
          sudo apt-get update
          sudo apt-get install -y gettext

      - name: Compile translations
        run: |
          python -m pip install --upgrade pip
          python -m pip install "Django>=5,<7"
          python -m django compilemessages --ignore .venv --ignore node_modules --ignore build --ignore dist

      - name: Build consent distribution
        run: |
          python -m pip install build setuptools wheel twine
          python -m build --wheel --no-isolation --outdir dist/consent packaging/consent

      - name: Validate consent metadata
        run: python -m twine check dist/consent/*.whl

      - name: Validate consent artifact content
        run: |
          python - <<'PY'
          import glob
          import zipfile

          wheels = glob.glob("dist/consent/*.whl")
          assert len(wheels) == 1, f"expected one consent wheel, got: {wheels}"
          with zipfile.ZipFile(wheels[0]) as zf:
              names = zf.namelist()
          assert any(n.startswith("django_consent_152fz/") for n in names), "consent package files are missing"
          assert not any(n.startswith("django_cookies_152fz/") for n in names), "cookies files leaked into consent wheel"
          PY

  package-cookies:
    name: Build package (cookies)
    runs-on: ubuntu-latest
    needs: [lint, tests-consent-standalone, tests-cookies-standalone, tests-integration, tests-api-extra]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install gettext
        run: |
          sudo apt-get update
          sudo apt-get install -y gettext

      - name: Compile translations
        run: |
          python -m pip install --upgrade pip
          python -m pip install "Django>=5,<7"
          python -m django compilemessages --ignore .venv --ignore node_modules --ignore build --ignore dist

      - name: Build cookies distribution
        run: |
          python -m pip install build setuptools wheel twine
          python -m build --wheel --no-isolation --outdir dist/cookies packaging/cookies

      - name: Validate cookies metadata
        run: python -m twine check dist/cookies/*.whl

      - name: Validate cookies artifact content
        run: |
          python - <<'PY'
          import glob
          import zipfile

          wheels = glob.glob("dist/cookies/*.whl")
          assert len(wheels) == 1, f"expected one cookies wheel, got: {wheels}"
          with zipfile.ZipFile(wheels[0]) as zf:
              names = zf.namelist()
          assert any(n.startswith("django_cookies_152fz/") for n in names), "cookies package files are missing"
          assert not any(n.startswith("django_consent_152fz/") for n in names), "consent files leaked into cookies wheel"
          PY

  package-install-smoke-consent:
    name: Install smoke (consent)
    runs-on: ubuntu-latest
    needs: [package-consent]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install gettext
        run: |
          sudo apt-get update
          sudo apt-get install -y gettext

      - name: Compile translations
        run: |
          python -m pip install --upgrade pip
          python -m pip install "Django>=5,<7"
          python -m django compilemessages --ignore .venv --ignore node_modules --ignore build --ignore dist

      - name: Build consent package
        run: |
          python -m pip install build setuptools wheel
          python -m build --wheel --no-isolation --outdir dist/consent packaging/consent

      - name: Smoke install consent package
        run: |
          python -m pip install --force-reinstall dist/consent/*.whl
          python -c "import django_consent_152fz; print(django_consent_152fz.__version__)"

  package-install-smoke-cookies:
    name: Install smoke (cookies)
    runs-on: ubuntu-latest
    needs: [package-cookies]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install gettext
        run: |
          sudo apt-get update
          sudo apt-get install -y gettext

      - name: Compile translations
        run: |
          python -m pip install --upgrade pip
          python -m pip install "Django>=5,<7"
          python -m django compilemessages --ignore .venv --ignore node_modules --ignore build --ignore dist

      - name: Build cookies package
        run: |
          python -m pip install build setuptools wheel
          python -m build --wheel --no-isolation --outdir dist/cookies packaging/cookies

      - name: Smoke install cookies package
        run: |
          python -m pip install --force-reinstall dist/cookies/*.whl
          python -c "import django_cookies_152fz; print(django_cookies_152fz.__version__)"

